[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-hr-llm-service"
version = "1.0.0"
description = "LLM service integration in Auto-HR system"
authors = [{name = "Auto-HR Team"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "aiofiles>=23.0.0",
    "requests>=2.31.0"
]

[tool.pylint]
disable = ["C0114", "C0116"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
